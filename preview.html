<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Biz 💖</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: black;
  color: white;
  overflow: hidden;
  text-align: center;
}

/* INTRO */
#intro {
  position: absolute;
  top: 40%;
  width: 100%;
  font-size: 28px;
  letter-spacing: 1px;
}

/* ANA SAYFA */
#main {
  display: none;
  height: 100vh;
  background: linear-gradient(135deg, #ff6a88, #ff99ac);
  padding-top: 40px;
  animation: fadeIn 2s ease;
}

h1 {
  font-size: 45px;
}

p {
  font-size: 20px;
  max-width: 600px;
  margin: 20px auto;
  opacity: 0;
  animation: fadeText 2s forwards;
}

#mesaj2 { animation-delay: 2s; }
#mesaj3 { animation-delay: 4s; }

button {
  margin-top: 20px;
  padding: 15px 25px;
  font-size: 18px;
  border: none;
  border-radius: 15px;
  background: white;
  color: #ff4f7a;
  cursor: pointer;
}

/* ANİMASYONLAR */
@keyframes fadeIn {
  from {opacity:0;}
  to {opacity:1;}
}

@keyframes fadeText {
  to {opacity:1;}
}

/* KALPLER */
.heart {
  position: fixed;
  color: pink;
  animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
  from { transform: translateY(100vh); opacity: 1; }
  to { transform: translateY(-10vh); opacity: 0; }
}

/* FINAL */
#final {
  display: none;
  font-size: 28px;
  margin-top: 30px;
  animation: fadeIn 2s ease;
}
</style>
</head>

<body>

<div id="intro"></div>

<div id="main">
  <h1>28 Mart 💖</h1>

  <p id="gun"></p>

  <p id="mesaj1">O gün… her şey değişti.</p>
  <p id="mesaj2">Çünkü sen hayatıma girdin.</p>
  <p id="mesaj3">Ve her şey daha güzel oldu…</p>

  <button onclick="finalMesaj()">Son Mesaj 💌</button>

  <div id="final"></div>
</div>

<audio id="muzik" loop>
  <source src="muzik.mp3" type="audio/mpeg">
</audio>

<script>
// INTRO YAZI EFEKTİ
const metin = [
  "28 Mart...",
  "Sıradan bir gün değildi.",
  "O gün...",
  "Seninle sevgili olduk."
];

let satir = 0;
let harf = 0;

function yaz() {
  if (satir < metin.length) {
    if (harf < metin[satir].length) {
      document.getElementById("intro").innerHTML += metin[satir].charAt(harf);
      harf++;
      setTimeout(yaz, 70);
    } else {
      document.getElementById("intro").innerHTML += "<br>";
      satir++;
      harf = 0;
      setTimeout(yaz, 800);
    }
  } else {
    setTimeout(gecis, 1500);
  }
}

function gecis() {
  document.getElementById("intro").style.display = "none";
  document.getElementById("main").style.display = "block";
  document.getElementById("muzik").play();
}

// GÜN SAYACI
const baslangic = new Date("2026-03-28");
const bugun = new Date();
const fark = Math.floor((bugun - baslangic) / (1000*60*60*24));

setTimeout(() => {
  document.getElementById("gun").innerText =
    fark + " gündür birlikteyiz 💖";
}, 2500);

// KALP ANİMASYONU
setInterval(() => {
  const kalp = document.createElement("div");
  kalp.innerHTML = "💗";
  kalp.className = "heart";
  kalp.style.left = Math.random() * 100 + "vw";
  kalp.style.fontSize = (15 + Math.random()*25) + "px";

  document.body.appendChild(kalp);

  setTimeout(() => kalp.remove(), 6000);
}, 400);

// FINAL MESAJ
function finalMesaj() {
  const final = document.getElementById("final");
  final.style.display = "block";
  final.innerText =
    "Pembe bizim rengimiz… çünkü seninle her şey daha güzel 💕 Seni çok seviyorum.";
}

yaz();
</script>

</body>
</html>
